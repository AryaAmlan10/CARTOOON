
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartoonWorld - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-left">
            <h1>🎬 CartoonWorld</h1>
            <h2>Let's Get You Back!</h2>
            <p>Don't worry! You can reset your password and continue your cartoon adventure.</p>
            <div class="cartoon-icon">🌈 ⭐ 🎨 🚀</div>
        </div>

        <div class="login-right">
            <h2>Forgot Password?</h2>
            <p class="subtitle">Enter your registered email address.</p>

            <form id="forgotPasswordForm">
                <label for="email">Registered Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <button type="submit" id="continueButton">
                    Continue
                </button>
            </form>

            <p id="forgotMessage"></p>

            <p class="register-text">
                Remember your password?
                <a href="index.html">Back to Login</a>
            </p>
        </div>
    </div>

    <script src="forgot-password.js"></script>
</body>
</html>
