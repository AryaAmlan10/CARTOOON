
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CartoonWorld - My Favorites</title>

    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="favorites.css">
</head>

<body>

    <header class="dashboard-header">

        <h1>🎬 CartoonWorld</h1>

        <nav>
            <a href="child-dashboard.html">Dashboard</a>
            <a href="cartoons.html">Cartoons</a>
            <a href="favorites.html">❤️ My Favorites</a>
            <button id="logoutButton" type="button">Logout</button>
        </nav>

    </header>

    <main class="dashboard-container">

        <section class="welcome-section">
            <h2>❤️ My Favorite Cartoons</h2>
            <p>All your saved cartoons in one place!</p>
        </section>

        <section id="favoritesContainer" class="favorites-container">

            <p id="loadingMessage">Loading your favorites...</p>

        </section>

        <p id="emptyMessage" class="empty-message" style="display:none;">
            You haven't added any favorite cartoons yet.
            <br><br>
            <a href="cartoons.html">Explore Cartoons</a>
        </p>

    </main>

    <script src="dashboard.js"></script>
    <script src="favorites.js"></script>

</body>
</html>
